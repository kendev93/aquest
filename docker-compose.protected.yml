# 编译版（Nuitka）分发的覆盖文件：在 docker-compose.yml 基础上换成不含源码的镜像。
#
#   export INDICATOR_LAB_IMAGE=<你的镜像标签>
#   docker compose -f docker-compose.yml -f docker-compose.protected.yml up -d
#
# 只替换构建方式与启动入口，数据卷、环境变量、worker token 的约定与默认编排一致。

x-protected-build: &protected-build
  context: .
  dockerfile: Dockerfile.protected
  args:
    NUITKA_JOBS: "${NUITKA_JOBS:-4}"
    NUITKA_LTO: "${NUITKA_LTO:-auto}"
    NUITKA_REPRODUCIBLE: "${NUITKA_REPRODUCIBLE:-auto}"

services:
  backend:
    build: *protected-build
    command: ["server", "--host", "0.0.0.0", "--port", "8123"]

  strategy-worker:
    build: *protected-build
    command: ["worker"]
