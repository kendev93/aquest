services:
  backend:
    user: "${ETFQUEST_MARKET_UID:-0}:${ETFQUEST_MARKET_GID:-0}"
    build:
      context: .
      dockerfile: Dockerfile.protected
      args:
        NUITKA_JOBS: "${NUITKA_JOBS:-4}"
        NUITKA_LTO: "${NUITKA_LTO:-auto}"
        NUITKA_REPRODUCIBLE: "${NUITKA_REPRODUCIBLE:-auto}"
    command: ["server", "--host", "0.0.0.0", "--port", "8123"]
    environment:
      SELECTOR_MARKET_DATA_SOURCE: etfquest
      SELECTOR_RELEASE_MODE: "1"
      SELECTOR_ETFQUEST_DATABASE_PATH: /run/etfquest/database/market_data.db
    volumes:
      - type: bind
        source: ${ETFQUEST_MARKET_DATABASE_DIR:?Set ETFQUEST_MARKET_DATABASE_DIR to ETFQuest's database directory}
        target: /run/etfquest/database
        read_only: false

  strategy-worker:
    build:
      context: .
      dockerfile: Dockerfile.protected
      args:
        NUITKA_JOBS: "${NUITKA_JOBS:-4}"
        NUITKA_LTO: "${NUITKA_LTO:-auto}"
        NUITKA_REPRODUCIBLE: "${NUITKA_REPRODUCIBLE:-auto}"
    command: ["worker"]
    environment:
      SELECTOR_MARKET_DATA_SOURCE: etfquest
      SELECTOR_RELEASE_MODE: "1"
      SELECTOR_ETFQUEST_DATABASE_PATH: /run/etfquest/database/market_data.db
    volumes:
      - type: bind
        source: ${ETFQUEST_MARKET_DATABASE_DIR:?Set ETFQUEST_MARKET_DATABASE_DIR to ETFQuest's database directory}
        target: /run/etfquest/database
        read_only: true
