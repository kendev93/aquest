# 一个容器同时托管 uvicorn（API）与 nginx（前端静态 + /api 反代）。
# 容器以 appuser(uid 10001) 运行，因此所有 pid/temp/log 都落在 /tmp 或
# 标准输出，nginx 监听 8080 而不是特权端口 80。

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:uvicorn]
command=uvicorn aquest.web.app:app --host 0.0.0.0 --port 8123
directory=/app
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20
