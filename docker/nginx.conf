pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log /dev/stdout;

    # 容器以非 root 用户运行，默认的 /var/lib/nginx 临时目录不可写。
    # nginx 启动时会预创建全部临时目录（含未用到的 fastcgi/uwsgi/scgi），
    # 少配一个都会 Permission denied 直接退出。
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    upstream aquest_backend {
        server 127.0.0.1:8123;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://aquest_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 波段研究 / 条件研究是同步接口，全市场样本要跑好几分钟。
            # nginx 默认 proxy_read_timeout 是 60s，不加这段必然 504。
            proxy_connect_timeout 10s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
            # 波段研究的 /stream 端点是 SSE。响应头里的 X-Accel-Buffering: no
            # 会让 nginx 关掉缓冲，别把它当成多余的头删掉 - 删了进度条就会
            # 等整次计算结束才一次性跳到 100%。
        }

        location = /healthz {
            proxy_pass http://aquest_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
