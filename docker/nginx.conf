events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream selector_backend {
        server backend:8123;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://selector_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 波段研究 / 条件研究是同步接口，全市场样本要跑好几分钟。
            # nginx 默认 proxy_read_timeout 是 60s，不加这段必然 504。
            proxy_connect_timeout 10s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
            # 波段研究的 /stream 端点是 SSE。响应头里的 X-Accel-Buffering: no
            # 会让 nginx 关掉缓冲，别把它当成多余的头删掉 - 删了进度条就会
            # 等整次计算结束才一次性跳到 100%。
        }

        location = /healthz {
            proxy_pass http://selector_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
