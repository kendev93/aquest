[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "indicator-lab"
version = "0.1.0"
description = "指标实验室：基于 DuckDB 的跨平台指标筛选、组合与回测应用"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
dependencies = [
  "cryptography>=41,<50",
  "duckdb>=1.5,<2",
  "fastapi>=0.110,<1",
  "lightgbm>=4,<5",
  "numpy>=1.24,<3",
  "optuna>=4,<5",
  "pandas>=2.0,<3",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.22,<1",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
# baostock 只用于「全市场证券目录 + 交易日历」：东财 clist 被封后这是唯一稳定
# 的全市场标的发现通道（见 docs/datasource-survey-2026-09-20.md）。它是可选依赖，
# 没装时目录自动回退到东财，日线主源（腾讯）不受影响。
# 容器镜像不走这里：requirements.lock 已包含 baostock，Dockerfile 只装清单、不装
# 本包（`pip install .` 会触发 PEP 517 构建隔离去拉 hatchling，白白多一个联网点）。
catalog = [
  "baostock>=0.8,<1",
]
dev = [
  "mypy>=1.9,<2",
  # starlette ≥ 1.6 的 TestClient 首选 httpx2，找不到才回退 httpx 并为此发一条
  # StarletteDeprecationWarning。httpx2 是独立发布（带自己的 httpcore2），不会
  # 顶替 httpx，装上即可消除该警告。生产运行时不用 TestClient，因此不进
  # requirements.lock、不影响容器镜像。
  "httpx2>=2.13,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.4,<1",
]

[project.scripts]
indicator-lab = "selector_app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["selector_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Pin the scratch directory outside the working tree and let pytest wipe it at
# the start of every run (see tmpdir.py: it rm_rf's a pinned basetemp, but
# stacks numbered copies otherwise).  Without this the macOS per-user temp root
# is reused across runs and test scratch files pile up in the repository.
# Requires a POSIX temp root; override with --basetemp=<dir> if needed.
addopts = "--tb=short --basetemp=/tmp/indicator-lab-pytest"
# 只过滤上游自己的弃用：starlette 1.6.0 的 testclient 在模块级类型别名里仍引用
# anyio 4.15 已弃用的 anyio.abc.BlockingPortal，导入即触发，改不了。留下它会让
# warnings summary 常驻一行噪声，真正属于本项目的警告就不显眼了——所以精确匹配
# 到该模块，不写成宽泛的 ignore。starlette 修好后删掉这一条。
filterwarnings = [
  "ignore:.*anyio\\.abc\\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
source = ["selector_app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]
