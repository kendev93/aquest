services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      SELECTOR_DATA_DIR: /data/market
      SELECTOR_AUTO_SYNC_ENABLED: "1"
      SELECTOR_DISCOVERY_WORKERS: "${SELECTOR_DISCOVERY_WORKERS:-auto}"
      SELECTOR_DISCOVERY_MEMORY_BUDGET_MB: "${SELECTOR_DISCOVERY_MEMORY_BUDGET_MB:-auto}"
    volumes:
      - type: volume
        source: market_data
        target: /data/market
    expose:
      - "8123"
    ports:
      - "127.0.0.1:${API_PORT:-8123}:8123"
    mem_limit: "${STRATEGY_WORKER_MEMORY_LIMIT:-0}"
    restart: unless-stopped

  strategy-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      SELECTOR_DATA_DIR: /data/market
      SELECTOR_DISCOVERY_WORKERS: "${SELECTOR_DISCOVERY_WORKERS:-auto}"
      SELECTOR_DISCOVERY_MEMORY_BUDGET_MB: "${SELECTOR_DISCOVERY_MEMORY_BUDGET_MB:-auto}"
      SELECTOR_DISCOVERY_JOB_DIR: /data/market/.strategy-jobs
    volumes:
      - type: volume
        source: market_data
        target: /data/market
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    command: ["python", "-m", "selector_app.strategy_discovery.worker"]
    mem_limit: "${STRATEGY_WORKER_MEMORY_LIMIT:-0}"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  market_data:
    name: indicator_lab_market
