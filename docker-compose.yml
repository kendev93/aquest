services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      SELECTOR_DATA_DIR: /data/market
    volumes:
      - type: volume
        source: vipdoc_data
        target: /data/vipdoc
      - type: volume
        source: market_data
        target: /data/market
    expose:
      - "8123"
    ports:
      - "127.0.0.1:${API_PORT:-8123}:8123"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  vipdoc_data:
    name: indicator_lab_vipdoc
  market_data:
    name: indicator_lab_market
