services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      SELECTOR_DATA_DIR: /data/market
      SELECTOR_MARKET_DATA_SOURCE: etfquest
      SELECTOR_RELEASE_MODE: "1"
      SELECTOR_ETFQUEST_DATABASE_PATH: /run/etfquest/database/market_data.db
      SELECTOR_AUTO_SYNC_ENABLED: "1"
      SELECTOR_DISCOVERY_WORKERS: "${SELECTOR_DISCOVERY_WORKERS:-auto}"
      SELECTOR_DISCOVERY_MEMORY_BUDGET_MB: "${SELECTOR_DISCOVERY_MEMORY_BUDGET_MB:-auto}"
      SELECTOR_STRATEGY_WORKER_TOKEN_FILE: /run/secrets/strategy_worker_token
    volumes:
      - type: bind
        source: ${ETFQUEST_APP_DATA_DIR:?Set ETFQUEST_APP_DATA_DIR to ETFQuest's application data directory}/indicator-lab
        target: /data/market
        bind:
          create_host_path: false
    secrets:
      - strategy_worker_token
    expose:
      - "8123"
    ports:
      - "127.0.0.1:${API_PORT:-8123}:8123"
    mem_limit: "${STRATEGY_WORKER_MEMORY_LIMIT:-0}"
    restart: unless-stopped

  strategy-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      SELECTOR_DATA_DIR: /data/market
      SELECTOR_MARKET_DATA_SOURCE: etfquest
      SELECTOR_RELEASE_MODE: "1"
      SELECTOR_ETFQUEST_DATABASE_PATH: /run/etfquest/database/market_data.db
      SELECTOR_DISCOVERY_WORKERS: "${SELECTOR_DISCOVERY_WORKERS:-auto}"
      SELECTOR_DISCOVERY_MEMORY_BUDGET_MB: "${SELECTOR_DISCOVERY_MEMORY_BUDGET_MB:-auto}"
      SELECTOR_STRATEGY_WORKER_API_URL: http://backend:8123
      SELECTOR_STRATEGY_WORKER_TOKEN_FILE: /run/secrets/strategy_worker_token
    volumes:
      - type: bind
        source: ${ETFQUEST_APP_DATA_DIR:?Set ETFQUEST_APP_DATA_DIR to ETFQuest's application data directory}/indicator-lab
        target: /data/market
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - strategy_worker_token
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    command: ["python", "-m", "selector_app.strategy_discovery.worker"]
    mem_limit: "${STRATEGY_WORKER_MEMORY_LIMIT:-0}"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    restart: unless-stopped

secrets:
  strategy_worker_token:
    file: ${ETFQUEST_APP_DATA_DIR:?Set ETFQUEST_APP_DATA_DIR to ETFQuest's application data directory}/indicator-lab/.strategy-worker-token
