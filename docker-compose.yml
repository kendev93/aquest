# A股策略研究的默认编排。
#
#   · 行情由容器自己从在线数据源同步，不依赖任何外部行情软件
#   · 数据放 Docker 命名卷，避开绑定挂载的宿主 uid 与文件共享层问题
#   · 策略 worker token 首次启动自动生成，用户无需任何手工步骤
#
# 用法：
#   export AQUEST_IMAGE=<你的镜像标签>
#   docker compose -f docker-compose.yml up -d
#
# 想自己管理数据目录（便于备份/迁移）就叠加绑定挂载覆盖文件，
# 见 docker-compose.bind.yml。
#
# 想用通达信下载的本地日线覆盖/补全行情，叠加 docker-compose.tdx.yml。

name: aquest

services:
  backend:
    image: ${AQUEST_IMAGE:?请设置 AQUEST_IMAGE 为已发布的镜像标签}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      AQUEST_DATA_DIR: /data/market
      AQUEST_AUTO_SYNC_ENABLED: "${AQUEST_AUTO_SYNC_ENABLED:-1}"
      AQUEST_DISCOVERY_WORKERS: "${AQUEST_DISCOVERY_WORKERS:-1}"
      AQUEST_DISCOVERY_MEMORY_BUDGET_MB: "${AQUEST_DISCOVERY_MEMORY_BUDGET_MB:-auto}"
      AQUEST_STRATEGY_WORKER_TOKEN_FILE: /data/market/.strategy-worker-token
      AQUEST_STRATEGY_WORKER_TOKEN_AUTOGENERATE: "1"
      # 单用户分发默认不保留整库备份：压缩期间仍需一份用于回滚，成功后立即删除。
      # 想保留几天就把它设成天数；数据库有数 GB 时每份备份都要占同样大的空间。
      AQUEST_DB_BACKUP_RETENTION_DAYS: "${AQUEST_DB_BACKUP_RETENTION_DAYS:-0}"
    volumes:
      - aquest-data:/data/market
    expose:
      - "8123"
      - "8080"
    ports:
      - "127.0.0.1:${API_PORT:-8123}:8123"
      # 8080 是容器内 nginx（前端静态 + /api 反代）；uvicorn 的 8123 只供本机直连 API。
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    mem_limit: "${STRATEGY_WORKER_MEMORY_LIMIT:-0}"
    restart: unless-stopped

  strategy-worker:
    image: ${AQUEST_IMAGE:?请设置 AQUEST_IMAGE 为已发布的镜像标签}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      AQUEST_DATA_DIR: /data/market
      AQUEST_DISCOVERY_WORKERS: "${AQUEST_DISCOVERY_WORKERS:-1}"
      AQUEST_DISCOVERY_MEMORY_BUDGET_MB: "${AQUEST_DISCOVERY_MEMORY_BUDGET_MB:-auto}"
      AQUEST_STRATEGY_POOL_MAX_WORKERS: "${AQUEST_STRATEGY_POOL_MAX_WORKERS:-1}"
      # 研究查询都是单标的小查询，DuckDB/BLAS 的默认全核线程池只会空转吃核；
      # 压到 1 把核让给真实的股票并发。只注入 strategy-worker，后端同步/导入不受影响。
      AQUEST_DUCKDB_THREADS: "${AQUEST_DUCKDB_THREADS:-1}"
      OPENBLAS_NUM_THREADS: "${OPENBLAS_NUM_THREADS:-1}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-1}"
      MKL_NUM_THREADS: "${MKL_NUM_THREADS:-1}"
      NUMEXPR_MAX_THREADS: "${NUMEXPR_MAX_THREADS:-1}"
      AQUEST_STRATEGY_WORKER_API_URL: http://backend:8123
      AQUEST_STRATEGY_WORKER_TOKEN_FILE: /data/market/.strategy-worker-token
    volumes:
      - aquest-data:/data/market
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    command: ["python", "-m", "aquest.strategy_discovery.worker"]
    mem_limit: "${STRATEGY_WORKER_MEMORY_LIMIT:-0}"
    restart: unless-stopped

volumes:
  aquest-data:
