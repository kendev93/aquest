services:
  backend:
    user: "${ETFQUEST_MARKET_UID:-0}:${ETFQUEST_MARKET_GID:-0}"
    environment:
      SELECTOR_MARKET_DATA_SOURCE: etfquest
      SELECTOR_RELEASE_MODE: "1"
      SELECTOR_ETFQUEST_DATABASE_PATH: /run/etfquest/database/market_data.db
    volumes:
      - type: bind
        source: ${ETFQUEST_MARKET_DATABASE_DIR:?Set ETFQUEST_MARKET_DATABASE_DIR to ETFQuest's database directory}
        target: /run/etfquest/database
        read_only: false

  strategy-worker:
    environment:
      SELECTOR_MARKET_DATA_SOURCE: etfquest
      SELECTOR_RELEASE_MODE: "1"
      SELECTOR_ETFQUEST_DATABASE_PATH: /run/etfquest/database/market_data.db
    volumes:
      - type: bind
        source: ${ETFQUEST_MARKET_DATABASE_DIR:?Set ETFQUEST_MARKET_DATABASE_DIR to ETFQuest's database directory}
        target: /run/etfquest/database
        read_only: true
