version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      web-ui-dependencies:
        patterns:
          - "*"
    ignore:
      # vue-tsc 通过 require.resolve('typescript/lib/tsc') 启动；TypeScript 7 是原生
      # 重写版，只导出 ./unstable/*，不再提供该子路径，升级会让 vue-tsc 直接报错退出。
      # 待 vuejs/language-tools 支持 tsgo 后再放开 7.x。
      - dependency-name: "typescript"
        versions: ["7.x"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      docker-images:
        patterns:
          - "*"
    ignore:
      # 上限与本仓库声明的 requires-python（<3.15）一致：3.15 刚发布（2026-10），哈希锁里那些
      # 编译包（numpy / pandas / scipy / numba / llvmlite / duckdb）还没有对应的轮子，先别让
      # dependabot 把镜像顶上去。3.14 这一档已经放开：2026-10-19 在同一份 --require-hashes
      # 锁上实测 python:3.14-slim 装得起来（全是 cp314 轮子，pip check 与 import 都通过），
      # 所以挡的理由不再是「装不起来」，只是「还没在 3.14 上跑过测试」。
      # 写法注意：docker 的 tag 带后缀（如 3.15.0-slim），原先只写 ["3.14", "3.14.*"] 想挡 3.14，
      # dependabot 照样开了 PR（#27 就是 3.14-slim），所以这里同时给比较式与几种裸号写法。
      # 哪几种写法真能匹配，只有下周一（2026-10-26）那次定时检查能验证。
      - dependency-name: "python"
        versions: [">= 3.15", "3.15", "3.15.*", "3.15-slim", "3.16", "3.16.*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
