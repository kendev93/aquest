version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      web-ui-dependencies:
        patterns:
          - "*"
    ignore:
      # vue-tsc 通过 require.resolve('typescript/lib/tsc') 启动；TypeScript 7 是原生
      # 重写版，只导出 ./unstable/*，不再提供该子路径，升级会让 vue-tsc 直接报错退出。
      # 待 vuejs/language-tools 支持 tsgo 后再放开 7.x。
      - dependency-name: "typescript"
        versions: ["7.x"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      docker-images:
        patterns:
          - "*"
    ignore:
      # 上限与本仓库声明的 requires-python（<3.15）一致：3.15 刚发布（2026-10），哈希锁里那些
      # 编译包（numpy / pandas / scipy / numba / llvmlite / duckdb）还没有对应的轮子，先别让
      # dependabot 把镜像顶上去。3.14 这一档已经放开：2026-10-19 在同一份 --require-hashes
      # 锁上实测 python:3.14-slim 装得起来（全是 cp314 轮子，pip check 与 import 都通过），
      # 所以挡的理由不再是「装不起来」，只是「还没在 3.14 上跑过测试」。
      # docker 的 versions 认 Bundler/Gem 比较式（官方文档：Docker 用 Bundler 版本语法），
      # 不接受 3.15.* 这种通配符——写进去会让整份配置解析失败。比较时会先剥掉 tag 后缀，
      # 所以一条 ">= 3.15" 同时盖住 3.15-slim、3.15.0-slim 以及之后的 3.16；别写
      # 3.15-slim，它会被当成版本号，永远匹配不上。
      - dependency-name: "python"
        versions: [">= 3.15"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
