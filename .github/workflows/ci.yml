name: CI

on:
  push:
  pull_request:

# 最小权限：CI 只读代码，不回写仓库，也不需要其他 scope。
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 和 Node 一样：镜像里的 Python 版本就是 CI 实际测的版本，不再各写一个数字。
      # Dependabot 顶 `FROM python:` 那行时会一起把这里带走，于是「CI 绿、镜像用另一个
      # 解释器」这种从没被测过的组合不可能出现；反过来，升级解释器就等于让 CI 去证明它。
      - name: 读取镜像的 Python 版本
        id: python-version
        working-directory: .
        run: |
          version=$(sed -n 's|^FROM python:\([0-9][0-9.]*\).*|\1|p' Dockerfile | head -1)
          case "$version" in
            [0-9]*.[0-9]*)
              ;;
            *)
              echo "没能从 Dockerfile 读出 python 版本，得到：[$version]" >&2
              exit 1
              ;;
          esac
          # 下限与 pyproject 的 requires-python（>=3.14,<3.15）一致：读出来比它低，说明
          # Dockerfile 和声明已经脱节，直接失败，而不是悄悄降级到另一个解释器上测。
          major=$(printf '%s' "$version" | cut -d. -f1)
          minor=$(printf '%s' "$version" | cut -d. -f2)
          if [ "$major" -ne 3 ] || [ "$minor" -lt 14 ]; then
            echo "镜像的 Python $version 低于项目声明的 3.14" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python-version.outputs.version }}
      - run: python -m pip install --upgrade pip
      # 顺序很重要：先装 dev/catalog extras（pytest、ruff、mypy、baostock 与 uvicorn 的
      # standard extras 从这里来），再用带 hashes 的 requirements.txt 收尾。反过来写的话，
      # 第二次解析会按 pyproject 的宽范围重新挑版本，运行时依赖就可能不再是镜像里那套了。
      # 注意镜像只装 requirements.txt，不带 extras：容器里的 uvicorn 用的是默认事件循环，
      # 也没有 watchfiles（supervisord 的启动命令不用 --reload）。
      - run: python -m pip install -e ".[dev,catalog]"
      - run: python -m pip install --require-hashes -r requirements.txt
      # 和 Dockerfile 同一道校验：依赖之间挑出版本冲突就在这里失败，而不是等镜像构建。
      - run: python -m pip check
      - run: sh scripts/verify_ci.sh python

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v7
      # 镜像里用哪个 Node 大版本，CI 就测哪个： Dependabot 的 docker 升级因此会把 CI 一起
      # 带走，而不是留下"CI 测 24、镜像用 26"这种从没被测过的组合（交付的静态产物恰恰是
      # 后者构建的）。想升到新版本就改 Dockerfile 那行 FROM。
      - name: 读取镜像的 Node 大版本
        id: node-major
        working-directory: .
        run: |
          major=$(sed -n 's/^FROM node:\([0-9][0-9]*\)[.-].*/\1/p' Dockerfile | head -1)
          case "$major" in
            ''|*[!0-9]*)
              echo "没能从 Dockerfile 读出 node 主版本，得到：[$major]" >&2
              exit 1
              ;;
          esac
          # 下限来自 web-ui 的 engines（>=22.22.2）：jsdom 30 -> undici 8 需要
          # node:worker_threads.markAsUncloneable，低于 22 直接别测了。
          if [ "$major" -lt 22 ]; then
            echo "镜像的 Node 大版本 $major 低于前端测试要求的 22" >&2
            exit 1
          fi
          printf 'major=%s\n' "$major" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node-major.outputs.major }}
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - run: sh ../scripts/verify_ci.sh frontend --install-playwright

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/verify_ci.sh docker
