name: CI

on:
  push:
  pull_request:

# 最小权限：CI 只读代码，不回写仓库，也不需要其他 scope。
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # 顺序很重要：先装 dev/catalog extras（pytest、ruff、mypy、baostock 与 uvicorn 的
      # standard extras 从这里来），再用带 hashes 的 requirements.txt 收尾。反过来写的话，
      # 第二次解析会按 pyproject 的宽范围重新挑版本，运行时依赖就可能不再是镜像里那套了。
      # 注意镜像只装 requirements.txt，不带 extras：容器里的 uvicorn 用的是默认事件循环，
      # 也没有 watchfiles（supervisord 的启动命令不用 --reload）。
      - run: python -m pip install -e ".[dev,catalog]"
      - run: python -m pip install --require-hashes -r requirements.txt
      # 和 Dockerfile 同一道校验：依赖之间挑出版本冲突就在这里失败，而不是等镜像构建。
      - run: python -m pip check
      - run: sh scripts/verify_ci.sh python

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # jsdom 30 -> undici 8 需要 node:worker_threads.markAsUncloneable（Node >= 22.19）
          node-version: 24
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - run: sh ../scripts/verify_ci.sh frontend --install-playwright

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/verify_ci.sh docker
